name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The unit suite is stdlib only; torch, Pocket TTS, Ollama and whisper.cpp are not needed.
      - run: python milo.py test
